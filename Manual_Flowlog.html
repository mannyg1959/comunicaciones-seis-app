        content: `### 1.1 Inicio de Sesión
Para ingresar a Flowlog, dirígete a la URL corporativa e ingresa tu correo electrónico corporativo junto con tu contraseña asignada por el Administrador del Sistema.

> [!NOTA]
> Flowlog restringe el acceso simultáneo desde múltiples pestañas con credenciales distintas para proteger la integridad de las transacciones y la sesión activa.

### 1.2 Roles y Perfiles Disponibles
El sistema cuenta con cuatro perfiles de usuario predeterminados:
- **Administrador General**: Control total del sistema, configuración, usuarios, tarifas y reportes financieros.
- **Ejecutivo de Ventas**: Creación y edición de presupuestos, cotizaciones, gestión de clientes y aprobación comercial.
- **Jefe de Producción**: Asignación de tareas, control de Kanban, actualización de estado en taller y consumo de insumos.
- **Operario de Taller / Diseñador**: Visualización de órdenes asignadas, registro de avances y tiempos de ejecución.

| Rol de Usuario | Dashboard | Cotizaciones | Órdenes de Trabajo | Ajustes del Sistema |
| :--- | :--- | :--- | :--- | :--- |
| **Administrador** | ✅ Acceso Total | ✅ Crear / Aprobar | ✅ Gestión Completa | ✅ Configuración Total |
| **Ventas** | ✅ Métricas Ventas | ✅ Crear / Enviar | 👁️ Solo Lectura | ❌ Sin Acceso |
| **Producción** | ✅ Métricas Taller | ❌ Sin Acceso | ✅ Cambiar Estados | ❌ Sin Acceso |
| **Operario** | ❌ Sin Acceso | ❌ Sin Acceso | 👁️ Ver Asignadas | ❌ Sin Acceso |

### 1.3 Seguridad y Recuperación de Contraseña
- En caso de olvidar tu contraseña, utiliza el enlace **"¿Olvidaste tu contraseña?"** en la pantalla de ingreso.
- El sistema enviará un código de verificación de 6 dígitos a tu bandeja de correo corporativo.
- Si no recibes el correo en 5 minutos, contacta al Administrador para un restablecimiento manual.

> [!ADVERTENCIA]

        content: `### 2.1 Menú Lateral Principal
La barra lateral izquierda contiene los accesos directos a todos los módulos autorizados según tu rol:
- **Inicio**: Panel central con indicadores de desempeño, órdenes urgentes y tareas pendientes.
- **Cotizaciones**: Generador de presupuestos, lista de cotizaciones y control de estados comerciales.

- **Ajustes**: Configuración corporativa, catálogo de materiales, tarifas por m2 y gestión de usuarios.

### 2.2 Accesos Rápidos y Atajos de Teclado
Para agilizar el flujo de trabajo diario, Flowlog soporta atajos de teclado universales:
- \`Ctrl + K\` o \`Cmd + K\`: Abre la barra de búsqueda global inteligente.
- \`Alt + N\`: Crea una nueva Cotización rápida desde cualquier pantalla.

- \`Esc\`: Cierra modales, ventanas emergentes y selectores activos.

> [!CONSEJO]
> Puedes colapsar la barra lateral izquierda haciendo clic en el botón con el ícono de menú en la esquina superior para maximizar el área de trabajo en pantallas pequeñas.`

Para generar una cotización formal:
1. Haz clic en el botón **"+ Nueva Cotización"** en el módulo de Cotizaciones.
2. Selecciona el **Cliente existente** o ingresa los datos de un nuevo contacto (Razón Social, NIT/RUT, Teléfono, Correo).
3. Agrega las líneas de producto especificando:
   - **Categoría**: Gran Formato, Vinilos, Acrílicos, Corpóreos, Display o Impresión Digital.
   - **Dimensiones**: Base y Altura en centímetros o metros.
   - **Cantidad de unidades**: Multiplicador de piezas idénticas.
   - **Material Base**: Lona Front, Backlight, Vinil Adhesivo, Acrílico 3mm, MDF, etc.
   - **Acabados**: Ojalillos, sellado perimetral, laminado mate/brillante, corte a registro o estructura metálica.

### 4.2 Desglose de Costos y Margen de Utilidad
Flowlog calcula automáticamente:
- **Costo Directo de Materiales**: Área neta multiplicada por el costo por m2 del material configurado en Ajustes.
- **Mano de Obra y Maquinaria**: Horas estimadas según la complejidad del acabado.
- **Margen de Ganancia**: Porcentaje sugerido (por defecto 45%) con opción de ajuste según negociación autorizada.
- **Impuestos**: Cálculo automático de IVA aplicable.

| :--- | :--- | :--- |

| **Enviada** | Enviada formalmente al cliente | Registrar seguimiento, reenviar por correo |
| **Aprobada** | Cliente confirmó el trabajo | Convertir automáticamente en Orden de Trabajo |
| **Rechazada** | Cliente declinó la propuesta | Archivar y registrar motivo de rechazo |

### 4.3 Acciones Rápidas en la Lista
- **Editar**: Modifica cantidades y especificaciones de presupuestos en borrador.
- **PDF**: Descarga la propuesta formal con membrete y términos comerciales.
- **Eliminar**: Borra cotizaciones en borrador (requiere rol de Administrador o Ventas).

Toda OT transita por cinco fases consecutivas obligatorias:
1. **Programación**: Revisión de archivos de impresión, confirmación de stock de insumos y asignación de maquinaria.
2. **En Producción**: Proceso activo en taller (impresión, troquelado, armado o confección).
3. **Control de Calidad**: Verificación de medidas, colores de prueba y acabado según la ficha técnica.
4. **Listo para Entrega / Instalación**: Producto embalado y rotulado en zona de despacho.
5. **Finalizado y Entregado**: Firma de acta de entrega o guía de remisión por parte del cliente.

### 5.2 Ficha Técnica y Archivos Adjuntos
Cada orden incluye un expediente digital con:
- Enlaces a archivos de producción de alta resolución (Google Drive / WeTransfer / Servidor Local).
- Comentarios y notas de taller con registro de fecha, hora y usuario.
- Historial de cambios de estado (Auditoría interna).

> [!ADVERTENCIA]

Esta herramienta permite estimar el aprovechamiento de material en rollos estándar (1.20m, 1.50m, 1.80m, 2.20m, 3.20m):

Calcula los mililitros aproximados por metro cuadrado según el tipo de tecnología:
- **Plotter Solvente / Ecosolvente**: Promedio de 8 a 12 ml/m2.

- **Sublimación Textil**: Promedio de 10 a 14 ml/m2.

> [!CONSEJO]

Define los valores unitarios para servicios adicionales:
- Costo por ojalillo metálico colocado.

- Se recomienda actualizar tu clave de acceso cada 90 días.
- La contraseña debe contener un mínimo de 8 caracteres, incluyendo al menos una mayúscula, un número y un símbolo.

Puedes activar o desactivar las alertas automáticas para:

El monitor organiza las órdenes en columnas visuales:
1. **Pendiente de Programar**: Trabajos aprobados en espera de asignación de insumo o turno de máquina.
2. **En Impresión / Corte**: Trabajos activos actualmente en la línea de producción.
3. **En Confección / Armado**: Trabajos en proceso manual de acabado, ensamble o estructura.
4. **Revisión de Calidad**: Inspección final previa al empaque.
5. **Listo para Despacho**: Órdenes terminadas listas para entrega en mostrador o ruta de despacho.

### 9.2 Códigos de Color de Prioridad
Las tarjetas de las órdenes cuentan con una franja lateral de color:
- 🟢 **Prioridad Normal**: Entrega en más de 48 horas.
- 🟡 **Prioridad Media**: Entrega en las próximas 24 a 48 horas.

    // App State
    let currentModuleId = 1;

    // Helper: Parse Markdown for HTML Display
    function parseMarkdownToHTML(markdown) {
      const lines = markdown.split('\n');
      let html = '';
      let tableBuffer = [];
      let inCode = false;
      let codeBuffer = [];
      let calloutBuffer = null;

      function flushTable() {
        if (tableBuffer.length < 2) {
          tableBuffer = [];
          return;
        }
        const rows = tableBuffer.map(line => 
          line.split('|').filter((_, idx, arr) => idx > 0 && idx < arr.length - 1).map(c => c.trim())
        );
        tableBuffer = [];

        const header = rows[0];
        const body = rows.slice(2);

        html += `<div class="my-6 overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-xs">
          <table class="w-full text-left text-xs md:text-sm border-collapse">
            <thead>
              <tr class="bg-slate-50 text-slate-700 border-b border-slate-200 font-bold">
                ${header.map(col => `<th class="py-3 px-4 text-slate-800 font-semibold tracking-wide">${formatInline(col)}</th>`).join('')}
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${body.map(row => `
                <tr class="hover:bg-slate-50/70 transition-colors">
                  ${row.map(cell => {
                    let val = formatInline(cell);
                    if (cell.includes('✅')) val = '<span class="text-emerald-600 font-bold inline-flex items-center gap-1"><i class="fa-solid fa-check"></i> SÍ</span>';
                    if (cell.includes('❌')) val = '<span class="text-rose-500 font-bold inline-flex items-center gap-1"><i class="fa-solid fa-xmark"></i> NO</span>';
                    return `<td class="py-3 px-4 text-slate-600">${val}</td>`;
                  }).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
      }

      function flushCallout() {
        if (!calloutBuffer) return;
        const { type, lines: cLines } = calloutBuffer;
        const text = formatInline(cLines.join(' '));
        calloutBuffer = null;

        let icon = '<i class="fa-solid fa-circle-info text-blue-600 mt-0.5"></i>';
        let styles = 'bg-blue-50/70 border-blue-200 text-blue-900';
        let badge = 'NOTA';

        if (type === 'ADVERTENCIA' || type === 'WARNING') {
          icon = '<i class="fa-solid fa-triangle-exclamation text-amber-600 mt-0.5"></i>';
          styles = 'bg-amber-50/70 border-amber-200 text-amber-900';
          badge = 'ADVERTENCIA';
        } else if (type === 'PELIGRO' || type === 'ERROR') {
          icon = '<i class="fa-solid fa-shield-halved text-rose-600 mt-0.5"></i>';
          styles = 'bg-rose-50/70 border-rose-200 text-rose-900';
          badge = 'IMPORTANTE';
        } else if (type === 'TIP' || type === 'CONSEJO') {
          icon = '<i class="fa-solid fa-circle-check text-emerald-600 mt-0.5"></i>';
          styles = 'bg-emerald-50/70 border-emerald-200 text-emerald-900';
          badge = 'RECOMENDACIÓN';
        }

        html += `<div class="my-5 p-4 rounded-xl border flex items-start gap-3.5 shadow-xs ${styles}">
          <div class="text-base shrink-0">${icon}</div>
          <div class="text-xs md:text-sm leading-relaxed">
            <span class="font-bold uppercase tracking-wider text-[11px] block mb-1">${badge}</span>
            <p class="opacity-95">${text}</p>
          </div>
        </div>`;
      }

      function formatInline(str) {
        return str
          .replace(/\*\*(.*?)\*\*/g, '<strong class="text-slate-900 font-semibold">$1</strong>')
          .replace(/`(.*?)`/g, '<code class="px-1.5 py-0.5 mx-0.5 bg-slate-100 text-blue-700 rounded font-mono text-[11px] border border-slate-200 font-semibold">$1</code>');
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // Code block
        if (line.trim().startsWith('```')) {
          if (inCode) {
            html += `<div class="my-4 p-4 rounded-xl bg-slate-900 border border-slate-800 font-mono text-xs text-emerald-400 overflow-x-auto shadow-xs"><pre>${codeBuffer.join('\n')}</pre></div>`;
            codeBuffer = [];
            inCode = false;
          } else {
            inCode = true;
          }
          continue;
        }

        if (inCode) {
          codeBuffer.push(line);
          continue;
        }

        // Callout start
        if (line.trim().startsWith('> [!')) {
          if (calloutBuffer) flushCallout();
          const match = line.match(/> \[!([A-ZÁÉÍÓÚÑ]+)\]/);
          calloutBuffer = { type: match ? match[1] : 'NOTA', lines: [] };
          continue;
        } else if (calloutBuffer) {
          if (line.trim().startsWith('>')) {
            calloutBuffer.lines.push(line.replace(/^>\s?/, ''));
            continue;
          } else {
            flushCallout();
          }
        }

        // Table lines
        if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
          tableBuffer.push(line);
          continue;
        } else if (tableBuffer.length > 0) {
          flushTable();
        }

        // Headings
        if (line.startsWith('##### ')) {
          html += `<h5 class="text-xs font-bold text-blue-600 mt-5 mb-2 uppercase tracking-wider">${formatInline(line.replace('##### ', ''))}</h5>`;
        } else if (line.startsWith('#### ')) {
          html += `<h4 class="text-base md:text-lg font-bold text-slate-900 mt-6 mb-2.5 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-blue-600 inline-block"></span>
            ${formatInline(line.replace('#### ', ''))}
          </h4>`;
        } else if (line.startsWith('### ')) {
          html += `<h3 class="text-lg md:text-xl font-bold text-slate-900 mt-7 mb-3 pb-2 border-b border-slate-200">${formatInline(line.replace('### ', ''))}</h3>`;
        } else if (line.startsWith('- ')) {
          html += `<li class="text-xs md:text-sm text-slate-700 ml-4 list-disc marker:text-blue-600 leading-relaxed my-1.5">${formatInline(line.replace('- ', ''))}</li>`;
        } else if (/^\d+\.\s/.test(line)) {
          const num = line.match(/^(\d+)\.\s/)[1];
          const text = line.replace(/^\d+\.\s/, '');
          html += `<div class="flex items-start gap-3 my-2 text-xs md:text-sm text-slate-700">
            <span class="w-5 h-5 rounded-full bg-blue-50 border border-blue-200 text-blue-700 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">${num}</span>
            <p class="leading-relaxed">${formatInline(text)}</p>
          </div>`;
        } else if (line.trim().length > 0) {
          html += `<p class="text-xs md:text-sm text-slate-700 leading-relaxed my-2.5">${formatInline(line)}</p>`;
        }
      }

      if (tableBuffer.length > 0) flushTable();
      if (calloutBuffer) flushCallout();

      return html;
    }

    // Render Sidebar List
    function renderSidebar(filteredList = manualModules) {
      const container = document.getElementById('module-nav-list');
      container.innerHTML = '';

      filteredList.forEach(mod => {
        const isActive = mod.id === currentModuleId;
        const btn = document.createElement('button');
        btn.id = `sidebar-btn-${mod.id}`;
        btn.onclick = () => selectModule(mod.id);
        btn.className = `w-full text-left p-2.5 rounded-xl transition-all flex items-center justify-between group ${
          isActive
            ? 'bg-blue-50 border border-blue-200 text-blue-900 shadow-xs'
            : 'hover:bg-slate-50 text-slate-700 border border-transparent'
        }`;

        btn.innerHTML = `
          <div class="flex items-center gap-2.5 min-w-0 pr-2">
            <span class="w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 ${
              isActive
                ? 'bg-blue-600 text-white shadow-xs'
                : 'bg-slate-100 text-slate-600 group-hover:bg-slate-200'
            }">
              ${mod.id}
            </span>
            <div class="min-w-0">
              <p class="text-xs font-bold truncate ${isActive ? 'text-blue-700' : 'text-slate-800'}">
                ${mod.shortTitle}
              </p>
              <span class="text-[10px] text-slate-500 block truncate">
                ${mod.badge}
              </span>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-xs transition-transform ${
            isActive ? 'text-blue-600 translate-x-0.5' : 'text-slate-300 group-hover:text-slate-500'
          }"></i>
        `;
        container.appendChild(btn);
      });

      document.getElementById('module-count-badge').innerText = `${filteredList.length} módulos disponibles`;
    }

    // Select and Render Active Module
    function selectModule(id) {
      currentModuleId = id;
      const mod = manualModules.find(m => m.id === id) || manualModules[0];

      // Update Header Card
      const headerCard = document.getElementById('module-header-card');
      headerCard.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-md text-xs font-bold bg-blue-50 border border-blue-200 text-blue-700 uppercase tracking-wide">
            <i class="fa-solid fa-sparkles text-blue-600"></i>
            ${mod.badge}
          </span>
          <div class="flex items-center gap-2 no-print">
            <button onclick="window.print()" class="px-3 py-1.5 rounded-lg border border-blue-200 bg-blue-50/70 hover:bg-blue-100 text-blue-700 text-xs font-semibold flex items-center gap-1.5 transition-colors shadow-2xs">
              <i class="fa-solid fa-print text-blue-600"></i>
              <span>Imprimir Módulo</span>
            </button>
          </div>
        </div>
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight mb-2">
          ${mod.title}
        </h1>
        <p class="text-sm text-slate-600 leading-relaxed">
          ${mod.summary}
        </p>
      `;

      // Update Body Card
      const contentCard = document.getElementById('module-content-card');
      contentCard.innerHTML = parseMarkdownToHTML(mod.content);

      // Update Pagination Buttons
      const prevBtn = document.getElementById('btn-prev-module');
      const nextBtn = document.getElementById('btn-next-module');
      
      if (mod.id > 1) {
        prevBtn.classList.remove('invisible');
        const prevMod = manualModules.find(m => m.id === mod.id - 1);
        document.getElementById('prev-module-title').innerText = prevMod.shortTitle;
      } else {
        prevBtn.classList.add('invisible');
      }

      if (mod.id < manualModules.length) {
        nextBtn.classList.remove('invisible');
        const nextMod = manualModules.find(m => m.id === mod.id + 1);
        document.getElementById('next-module-title').innerText = nextMod.shortTitle;
      } else {
        nextBtn.classList.add('invisible');
      }

      // Re-render sidebar to update active state
      renderSidebar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Filter Search
    function filterModules(query) {
      const clearBtn = document.getElementById('clear-search-btn');
      if (query.trim()) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      const q = query.toLowerCase().trim();
      const filtered = manualModules.filter(m => 
        m.title.toLowerCase().includes(q) ||
        m.summary.toLowerCase().includes(q) ||
        m.content.toLowerCase().includes(q)
      );

      renderSidebar(filtered);
    }

    function clearSearch() {
      const input = document.getElementById('manual-search-input');
      input.value = '';
      filterModules('');
    }

    // Navigate Next/Prev
    function navigateModule(direction) {
      const targetId = currentModuleId + direction;
      if (targetId >= 1 && targetId <= manualModules.length) {
        selectModule(targetId);
      }
    }

    // Populate Complete 11 Modules for Print/PDF
    function renderCompletePrintView() {
      const printContainer = document.getElementById('complete-print-container');
      if (!printContainer) return;

      let html = `
        <!-- PORTADA OFICIAL PARA IMPRESIÓN / PDF -->
        <div class="p-8 mb-8 border-b-2 border-slate-300">
          <div class="bg-blue-700 text-white p-8 rounded-xl">
            <div class="text-xs uppercase tracking-widest text-blue-200 font-bold mb-2">Manual Oficial de Operación</div>
            <h1 class="text-3xl font-extrabold tracking-tight">FLOWLOG · COMUNICACIÓN 6</h1>
            <p class="text-sm text-blue-100 mt-1">SISTEMA INTEGRAL DE GESTIÓN Y PRODUCCIÓN</p>
            <div class="h-0.5 bg-blue-500/60 my-6"></div>
            <h2 class="text-xl font-bold">MANUAL COMPLETO DE USUARIO (11 MÓDULOS)</h2>
            <p class="text-xs text-blue-200 mt-1">Guía completa de usuario, reglas de negocio, tablas de permisos y flujos de trabajo.</p>
            <div class="mt-8 pt-4 border-t border-blue-600/60 flex justify-between text-[11px] text-blue-200">
              <span>Versión del Sistema: 2.4</span>
              <span>Fecha de Emisión: 2026 · Comunicación 6</span>
            </div>
          </div>
        </div>

        <!-- ÍNDICE DE CONTENIDOS -->
        <div class="p-6 mb-8 border border-slate-200 rounded-xl bg-slate-50/50 avoid-break">
          <h3 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-200 uppercase tracking-wider text-xs">
            Índice de Módulos
          </h3>
          <div class="grid grid-cols-2 gap-x-6 gap-y-2 text-xs">
            ${manualModules.map(m => `
              <div class="flex items-center justify-between py-1 border-b border-slate-100">
                <span class="font-medium text-slate-800">${m.id}. ${m.shortTitle}</span>
                <span class="text-slate-400 font-mono text-[10px]">${m.badge}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      // Render each of the 11 modules
      manualModules.forEach((mod, idx) => {
        html += `
          <div class="${idx > 0 ? 'page-break' : ''} pt-4 mb-8">
            <div class="border-b-2 border-blue-600 pb-3 mb-4 flex items-center justify-between">
              <div>
                <span class="text-[10px] uppercase font-bold tracking-wider text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">
                  ${mod.badge}
                </span>
                <h2 class="text-xl font-bold text-slate-900 mt-1">
                  ${mod.title}
                </h2>
              </div>
              <span class="text-xs font-mono font-bold text-slate-400">
                Módulo ${mod.id} de 11
              </span>
            </div>

            <p class="text-xs italic text-slate-600 mb-6 bg-slate-50 p-3 rounded-lg border border-slate-200">
              <strong>Resumen:</strong> ${mod.summary}
            </p>

            <div class="text-slate-800 text-xs leading-relaxed">
              ${parseMarkdownToHTML(mod.content)}
            </div>
          </div>
        `;
      });

      printContainer.innerHTML = html;
    }

    // Print all modules handler
    function printCompleteManual() {
      renderCompletePrintView();
      window.print();
    }

    // Initialize on Load
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar();
      selectModule(1);
      renderCompletePrintView();
    });
  </script>
